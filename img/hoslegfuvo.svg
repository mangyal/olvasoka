<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Hőlégfúvó</title>
  <style>
    /* F-R13: a hőhullámok hullámzanak, a test enyhén rezeg; a fogantyú és a kábel áll */
    .wave { transform-box: fill-box; transform-origin: 100% 50%; animation: wave 900ms ease-in-out infinite alternate; }
    .wave.w2 { animation-duration: 700ms; animation-delay: -350ms; }
    .body { animation: buzz 140ms steps(2, jump-none) infinite; }
    @keyframes wave {
      0%   { transform: translate(0, -2.5px) scaleX(0.85); opacity: .45; }
      100% { transform: translate(-2px, 2.5px) scaleX(1.15); opacity: 1; }
    }
    @keyframes buzz {
      0%   { transform: translate(0, 0); }
      50%  { transform: translate(0.7px, -0.5px); }
      100% { transform: translate(-0.5px, 0.4px); }
    }
    @media (prefers-reduced-motion: reduce) { .wave, .body { animation: none; } }
  </style>
  <g stroke="#1f2328" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- kábel -->
    <path d="M95 108 C95 120 108 122 118 115" fill="none" stroke-width="4"/>
    <!-- ravasz -->
    <rect x="68" y="61" width="10" height="13" rx="3" fill="#1f2328"/>
    <!-- markolat -->
    <path d="M74 56 L98 56 L106 101 Q107 108 100 108 L90 108 Q84 108 83 102 Z" fill="#3a3f47"/>
  </g>
  <g class="body">
    <g stroke="#1f2328" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <!-- fém fúvócső -->
      <rect x="22" y="37" width="28" height="18" rx="2" fill="#ced4da"/>
      <rect x="17" y="34" width="9" height="24" rx="2" fill="#868e96"/>
      <!-- test -->
      <rect x="44" y="27" width="72" height="38" rx="15" fill="#e8590c"/>
    </g>
    <!-- csillanás a testen -->
    <rect x="54" y="32" width="40" height="5" rx="2.5" fill="#ffa94d"/>
    <!-- szellőzőnyílások -->
    <g stroke="#1f2328" stroke-width="3" stroke-linecap="round">
      <line x1="100" y1="39" x2="100" y2="53"/>
      <line x1="107" y1="39" x2="107" y2="53"/>
    </g>
  </g>
  <!-- hőhullámok -->
  <g fill="none" stroke="#fa5252" stroke-width="3.5" stroke-linecap="round">
    <path class="wave" d="M12 31 q-4 4 0 8 q4 4 0 8 q-4 4 0 8 q4 4 0 8"/>
    <path class="wave w2" d="M5 37 q-3 3 0 6 q3 3 0 6 q-3 3 0 6"/>
  </g>
</svg>
