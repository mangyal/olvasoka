name: Kiadás egy gombnyomással

# Actions → Kiadás egy gombnyomással → Run workflow (ág: main), lépés: patch / minor / major.
#
# 1. Verzió-PR: az éles (main) verzióból kiszámolja az újat, release/vX.Y.Z ágra commitolja,
#    és PR-t nyit a dev-be. A PR-on lefutnak a Tesztek (test, layout, e2e); ha mind zöld, összevonja.
# 2. Kiadási PR (dev → main): megnyitja (vagy a meglévő PR frissül). Lefutnak rajta a Tesztek és a
#    Kiadás ellenőrzése (check); ha MIND zöld, merge committal összevonja.
# 3. A main-re érkező push elindítja a Kiadás (GitHub Pages) workflow-t (kiadás + füstteszt + vX.Y.Z
#    tag); ez a workflow megvárja az eredményét.
#
# RELEASE_TOKEN secret kell hozzá (Settings → Secrets and variables → Actions):
#   fine-grained personal access token, csak erre a repóra, jogok: Contents, Pull requests,
#   Workflows: Read and write. Miért? A GITHUB_TOKEN-nel nyitott PR, összevonás és push nem indít
#   más workflow-t, és a dev-re közvetlen push a ruleset miatt nem megy (ki is próbáltuk: elutasítja,
#   pedig a commiton zöldek voltak az ellenőrzések). A tokennel minden úgy fut, mintha kézzel csinálnád.
#
# Védőkorlát: ha a main-en olyan változás van, ami a dev-ből hiányzik (hotfix/infra), megáll.
# Újrafuttatható: ha a dev már az új verzión van, a verzió-PR kimarad.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Léptetés: patch = javítás (1.0.1 → 1.0.2), minor = új funkció (→ 1.1.0), major = nem visszafelé kompatibilis (→ 2.0.0)'
        type: choice
        required: true
        default: minor
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Hiányzik a RELEASE_TOKEN secret (lásd a workflow fájl elején)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Segédfüggvények
        run: |
          cat > "$RUNNER_TEMP/lib.sh" <<'EOF'
          ver() { sed -n "s/.*VERSION = '\([0-9.]*\)'.*/\1/p"; }

          # wait_checks SHA név...  – megvárja, amíg a commiton a megnevezett ellenőrzések MINDEN
          # futása sikeresen lefut; bármelyik hibája vagy 30 perc után hibával tér vissza.
          wait_checks() {
            local sha=$1; shift
            local deadline=$((SECONDS + 1800)) json n st pending
            echo "Várakozás: $* @ ${sha:0:7}"
            sleep 15
            while :; do
              json=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100&filter=all")
              pending=""
              for n in "$@"; do
                st=$(jq -r --arg n "$n" '[.check_runs[] | select(.name == $n and .app.id == 15368)]
                       | if length == 0 then "pending"
                         elif any(.status != "completed") then "pending"
                         elif all(.conclusion == "success") then "ok"
                         else "fail" end' <<< "$json")
                case "$st" in
                  ok) ;;
                  fail) echo "::error::A(z) '$n' ellenőrzés nem sikerült."; return 1 ;;
                  *) pending="$pending $n" ;;
                esac
              done
              [ -z "$pending" ] && { echo "Mind zöld: $*"; return 0; }
              if [ $SECONDS -gt $deadline ]; then echo "::error::Időtúllépés, még fut / hiányzik:$pending"; return 1; fi
              echo "  még fut / hiányzik:$pending"
              sleep 20
            done
          }

          # merge_pr PR SHA CÍM – merge committal; a sha miatt elutasítja, ha közben új commit jött
          merge_pr() {
            gh api -X PUT "repos/$REPO/pulls/$1/merge" -f merge_method=merge -f sha="$2" -f commit_title="$3" --jq .sha
          }
          EOF

      - name: 1. Új verzió
        id: v
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -e
          . "$RUNNER_TEMP/lib.sh"
          prod=$(git show origin/main:js/version.js | ver)
          dev=$(ver < js/version.js)
          IFS=. read -r a b c <<< "$prod"
          case "$BUMP" in
            major) new="$((a+1)).0.0" ;;
            minor) new="$a.$((b+1)).0" ;;
            patch) new="$a.$b.$((c+1))" ;;
          esac
          echo "éles: $prod  dev: $dev  új: $new"

          if ! git diff --quiet origin/dev...origin/main; then
            echo "::error::A main-en olyan változás van, ami a dev-ből hiányzik. Előbb vond össze a Dev szinkron (main → dev) PR-t, utána futtasd újra."
            git log --no-merges --format='  %h %s' origin/dev..origin/main
            exit 1
          fi
          if git diff --quiet origin/main origin/dev; then
            echo "::error::A dev tartalma azonos a main-nel – nincs mit kiadni."
            exit 1
          fi
          if [ "$dev" != "$new" ] && [ "$(printf '%s\n%s\n' "$dev" "$new" | sort -V | tail -1)" != "$new" ]; then
            echo "::error::A dev verziója ($dev) már nagyobb, mint az új ($new). Válassz nagyobb lépést."
            exit 1
          fi
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "bump_needed=$([ "$dev" = "$new" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "## Kiadás: v$prod → v$new" >> "$GITHUB_STEP_SUMMARY"

      - name: 2. Verzió-PR (release/vX.Y.Z → dev)
        if: steps.v.outputs.bump_needed == 'true'
        env:
          NEW: ${{ steps.v.outputs.new }}
        run: |
          set -e
          . "$RUNNER_TEMP/lib.sh"
          branch="release/v$NEW"
          sed -i "s/VERSION = '[^']*'/VERSION = '$NEW'/" js/version.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Verzió: v$NEW"
          git push -qf origin "HEAD:refs/heads/$branch"   # egy félbemaradt futás ágát felülírja
          sha=$(git rev-parse HEAD)

          pr=$(gh pr list -R "$REPO" --base dev --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            url=$(gh pr create -R "$REPO" --base dev --head "$branch" --title "Verzió: v$NEW" \
                    --body "A *Kiadás egy gombnyomással* workflow nyitotta: $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID")
            pr=${url##*/}
          fi
          echo "- Verzió-PR: #$pr" >> "$GITHUB_STEP_SUMMARY"

          wait_checks "$sha" test layout e2e
          merge_pr "$pr" "$sha" "Merge PR #$pr: Verzió: v$NEW" > /dev/null
          git push -q origin --delete "$branch" || true
          echo "- dev → v$NEW, tesztek zöldek ✓" >> "$GITHUB_STEP_SUMMARY"

      - name: 3. Kiadási PR (dev → main)
        id: rel
        env:
          NEW: ${{ steps.v.outputs.new }}
        run: |
          set -e
          . "$RUNNER_TEMP/lib.sh"
          git fetch -q origin dev main
          sha=$(git rev-parse origin/dev)
          {
            echo "Automatikus kiadás a *Kiadás egy gombnyomással* workflow-ból: $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "## Mi változott"
            echo
            git log --no-merges --format='- %s (%h)' origin/main..origin/dev
          } > body.md
          title="Kiadás v$NEW"
          pr=$(gh pr list -R "$REPO" --base main --head dev --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" -R "$REPO" --title "$title" --body-file body.md > /dev/null
          else
            url=$(gh pr create -R "$REPO" --base main --head dev --title "$title" --body-file body.md)
            pr=${url##*/}
          fi
          echo "- Kiadási PR: #$pr" >> "$GITHUB_STEP_SUMMARY"

          wait_checks "$sha" test layout e2e check
          main_sha=$(merge_pr "$pr" "$sha" "Kiadás v$NEW (#$pr)")
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "- Összevonva → main (\`${main_sha:0:7}\`), minden ellenőrzés zöld ✓" >> "$GITHUB_STEP_SUMMARY"

      - name: 4. Kiadás (GitHub Pages) megvárása
        env:
          NEW: ${{ steps.v.outputs.new }}
          MAIN_SHA: ${{ steps.rel.outputs.main_sha }}
        run: |
          set -e
          id=""
          for i in $(seq 1 30); do
            id=$(gh run list -R "$REPO" -w deploy.yml -b main -c "$MAIN_SHA" --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$id" ] && break
            sleep 5
          done
          [ -n "$id" ] || { echo "::error::Nem indult el a Kiadás a main-en."; exit 1; }
          echo "Kiadás futás: $GITHUB_SERVER_URL/$REPO/actions/runs/$id"
          if gh run watch "$id" -R "$REPO" --exit-status -i 30 > /dev/null; then
            echo "- ✅ **v$NEW élesben**: https://mangyal.github.io/olvasoka/ (kiadás, füstteszt, tag rendben)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ❌ A Kiadás futás hibás: $GITHUB_SERVER_URL/$REPO/actions/runs/$id" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
