name: Dev szinkron (main → dev)

# Figyeli, hogy a main minden tartalmi változása (hotfix, infra) bekerült-e a dev-be.
# Közvetlenül a dev-re nem pusholhat (az „e2e tests branch” ruleset kötelező ellenőrzései miatt),
# ezért teendő esetén issue-t nyit egy linkkel a main → dev PR-hoz; a PR-t a tulajdonos nyitja meg,
# így lefutnak rajta az ellenőrzések. Ha a dev utolérte a main-t, az issue-t magától lezárja.
#
# Kiadás (dev → main) után nincs teendő: a main tartalma ilyenkor azonos a dev-ével.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sync-dev
  cancel-in-progress: false

jobs:
  # nem „check”: az a main kötelező ellenőrzésének (Kiadás ellenőrzése) neve, ne keveredjen vele
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kell-e szinkron
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          title="Dev szinkron: a main változásai hiányoznak a dev-ből"
          git fetch -q origin main dev
          issue=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')

          # a main tartalmi változásai a közös ős óta (kiadás után üres)
          if git diff --quiet origin/dev...origin/main; then
            echo "A dev tartalmazza a main összes változását."
            if [ -n "$issue" ]; then
              gh issue close "$issue" -R "$REPO" -c "A dev utolérte a main-t ($(git rev-parse --short origin/dev)). ✓"
            fi
            exit 0
          fi

          pr="https://github.com/$REPO/compare/dev...main?expand=1&title=$(python3 -c 'import urllib.parse;print(urllib.parse.quote("Szinkron: main → dev"))')"
          {
            echo "A \`main\`-en olyan változás van, ami a \`dev\`-ből hiányzik (hotfix vagy infra után ez várható)."
            echo
            echo "**[PR megnyitása: main → dev]($pr)** – a cím ki van töltve. Ha az ellenőrzések zöldek, vond össze."
            echo "Ütközés esetén a PR oldalán *Resolve conflicts*, vagy kérd meg az ágenst."
            echo
            echo "Hiányzó commitok:"
            echo
            git log --no-merges --format='- %h %s' origin/dev..origin/main
            echo
            echo "_Ezt az issue-t a *Dev szinkron* workflow kezeli, és magától lezárja, ha a dev utolérte a main-t._"
          } > body.md
          if [ -n "$issue" ]; then
            gh issue edit "$issue" -R "$REPO" --body-file body.md
            echo "Issue frissítve: #$issue"
          else
            gh issue create -R "$REPO" --title "$title" --body-file body.md
          fi
          cat body.md >> "$GITHUB_STEP_SUMMARY"
