name: Kiadás (GitHub Pages)

# Egy GitHub Pages oldal = egy csomag, ezért minden futás a teljes oldalt rakja össze:
#   main → https://mangyal.github.io/olvasoka/       (éles)
#   dev  → https://mangyal.github.io/olvasoka/dev/   (fejlesztői)
# Egy dev push az élest a változatlan main-ből építi újra, így annak tartalma bájtra azonos marad.
#
# Figyelem: a futás a pusholt ág saját deploy.yml-jét használja. A workflow módosításai ezért
# infra/* ágon, közvetlenül a main-be menjenek, utána a main-t vissza kell olvasztani a dev-be.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write   # verzió-tag a main-en
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      prod_version: ${{ steps.versions.outputs.prod }}
      dev_version: ${{ steps.versions.outputs.dev }}
    steps:
      - name: Éles (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Van-e dev ág
        id: dev
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" dev >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fejlesztői (dev)
        if: steps.dev.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: dev
          path: devsrc
          fetch-depth: 0   # a ki nem adott commitok számolásához (dev verziócímke)

      - name: Összerakás
        run: |
          set -e
          cp site/.github/scripts/write-sheet-config.mjs "$RUNNER_TEMP/"
          rm -rf site/.git site/.github
          if [ -d devsrc ]; then
            rm -rf site/dev
            mkdir site/dev
            (cd devsrc && tar --exclude=.git --exclude=.github -cf - .) | tar -xf - -C site/dev
            pip install --quiet pillow
            python3 devsrc/.github/scripts/make-dev-variant.py site/dev
          fi

      - name: Verziók
        # A dev címkéje: a dev verziója + a még ki nem adott (main-ben nem lévő, merge nélküli) commitok
        # száma, pl. 1.0.2+5. Csak a kiadott fájlba kerül, a repóba nem; 0 esetén nincs utótag.
        id: versions
        run: |
          ver() { [ -f "$1" ] && sed -n "s/.*VERSION = '\([0-9.]*\)'.*/\1/p" "$1"; }
          prod=$(ver site/js/version.js)
          dev=$(ver site/dev/js/version.js || true)
          if [ -n "$dev" ]; then
            n=$(git -C devsrc rev-list --count --no-merges origin/main..HEAD)
            if [ "$n" -gt 0 ]; then
              dev="$dev+$n"
              sed -i "s/VERSION = '[^']*'/VERSION = '$dev'/" site/dev/js/version.js
            fi
          fi
          echo "prod=$prod" >> "$GITHUB_OUTPUT"
          echo "dev=$dev" >> "$GITHUB_OUTPUT"
          echo "éles: $prod  dev: ${dev:--}"

      - name: A táblázat címei (repository variable-ök)
        # Settings → Secrets and variables → Actions → Variables. Változtatás után a workflow-t újra kell
        # futtatni (Actions → Kiadás → Run workflow), mert a változó módosítása magától nem indít kiadást.
        env:
          PROD_SHEET_CSV_URL: ${{ vars.PROD_SHEET_CSV_URL }}
          PROD_SHEET_EDIT_URL: ${{ vars.PROD_SHEET_EDIT_URL }}
          DEV_SHEET_CSV_URL: ${{ vars.DEV_SHEET_CSV_URL }}
          DEV_SHEET_EDIT_URL: ${{ vars.DEV_SHEET_EDIT_URL }}
        run: node "$RUNNER_TEMP/write-sheet-config.mjs" site/js/core/config.js site/dev/js/core/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    # füstteszt az élő oldalon (e2e/smoke.mjs): éles/dev címke, verziószám, /dev átirányítás, dev ≥ éles.
    # Megvárja, amíg az oldal a most kiadott verziókat mutatja (a Pages gyorsítótára néhány percig késhet).
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright (csak a teszthez, a repóba nem kerül)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Füstteszt
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          EXPECT_PROD: ${{ needs.build.outputs.prod_version }}
          EXPECT_DEV: ${{ needs.build.outputs.dev_version }}
        run: node --test e2e/smoke.mjs

  tag:
    # sikeres éles kiadás után: vX.Y.Z tag a js/version.js alapján (ha még nincs ilyen)
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          v="v$(sed -n "s/.*VERSION = '\([0-9.]*\)'.*/\1/p" js/version.js)"
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "$v már létezik, nincs új tag."
          else
            git tag "$v" && git push origin "$v" && echo "tag: $v"
          fi
