name: Kiadás előkészítése

# Egy gombnyomásos kiadás-előkészítés: Actions → Kiadás előkészítése → Run workflow (ág: main),
# majd a lépés kiválasztása (patch / minor / major).
#
# 1. Az éles (main) verzióból kiszámolja az újat, és a dev-ből egy release/vX.Y.Z ágra beírja.
# 2. Az összefoglalóban két linket ad, kitöltött címmel:
#    a) verzió-PR: release/vX.Y.Z → dev   b) kiadási PR: dev → main
#    A PR-okat a tulajdonos nyitja meg és vonja össze: így futnak le rajtuk a kötelező ellenőrzések.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Léptetés: patch = javítás (1.0.1 → 1.0.2), minor = új funkció (→ 1.1.0), major = nem visszafelé kompatibilis (→ 2.0.0)'
        type: choice
        required: true
        default: minor
        options: [patch, minor, major]

permissions:
  contents: write   # a release/vX.Y.Z ág pusholása

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Új verzió
        id: v
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          ver() { sed -n "s/.*VERSION = '\([0-9.]*\)'.*/\1/p"; }
          prod=$(git show origin/main:js/version.js | ver)
          dev=$(ver < js/version.js)
          IFS=. read -r a b c <<< "$prod"
          case "$BUMP" in
            major) new="$((a+1)).0.0" ;;
            minor) new="$a.$((b+1)).0" ;;
            patch) new="$a.$b.$((c+1))" ;;
          esac
          ahead=$(git rev-list --count --no-merges origin/main..HEAD)
          echo "éles: $prod  dev: $dev  új: $new  ki nem adott commitok: $ahead"
          if [ "$ahead" -eq 0 ]; then
            echo "::warning::A dev-en nincs ki nem adott változás; a kiadás az élesen semmit nem változtatna."
          fi
          echo "prod=$prod" >> "$GITHUB_OUTPUT"
          echo "dev=$dev" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Verzióág (release/vX.Y.Z)
        # A dev-re közvetlenül nem lehet pusholni (az „e2e tests branch” ruleset kötelező ellenőrzései
        # miatt, amelyek bot-commiton sosem futnak le), ezért a léptetés külön ágra kerül, és PR-ral
        # jut a dev-be. A PR-t a tulajdonos nyitja meg, így az ellenőrzések lefutnak rajta.
        id: br
        env:
          NEW: ${{ steps.v.outputs.new }}
          DEV: ${{ steps.v.outputs.dev }}
        run: |
          if [ "$NEW" = "$DEV" ]; then
            echo "A dev már $NEW; nincs mit léptetni."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="release/v$NEW"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "::error::A $branch ág már létezik. Ha egy korábbi próbálkozás maradéka, töröld (Branches oldal), és futtasd újra."
            exit 1
          fi
          sed -i "s/VERSION = '[^']*'/VERSION = '$NEW'/" js/version.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Verzió: v$NEW (kiadás előkészítése)"
          git push origin "HEAD:refs/heads/$branch"
          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Linkek
        env:
          NEW: ${{ steps.v.outputs.new }}
          PROD: ${{ steps.v.outputs.prod }}
          NEEDED: ${{ steps.br.outputs.needed }}
          BRANCH: ${{ steps.br.outputs.branch }}
        run: |
          q() { python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$1"; }
          repo="https://github.com/${{ github.repository }}"
          bump="$repo/compare/dev...$BRANCH?expand=1&title=$(q "Verzió: v$NEW")"
          rel="$repo/compare/main...dev?expand=1&title=$(q "Kiadás v$NEW")"
          {
            echo "## Kiadás előkészítve: v$PROD → v$NEW"
            echo
            if [ "$NEEDED" = "true" ]; then
              echo "1. **[Verzió-PR megnyitása ($BRANCH → dev)]($bump)** – a cím ki van töltve. Ha zöld, vond össze."
            else
              echo "1. ~~Verzió-PR~~ – a dev már v$NEW, ez a lépés kimarad."
            fi
            echo "2. Várd meg, amíg a dev oldalon a fejléc **DEV · v$NEW** lesz, és próbáld ki."
            echo "3. **[Kiadási PR megnyitása (dev → main)]($rel)** – pipáld ki a listát, majd **merge committal** vond össze."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Verzió-PR: $bump"
          echo "Kiadási PR: $rel"
