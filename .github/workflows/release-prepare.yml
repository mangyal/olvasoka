name: Kiadás előkészítése

# Egy gombnyomásos kiadás-előkészítés: Actions → Kiadás előkészítése → Run workflow (ág: main),
# majd a lépés kiválasztása (patch / minor / major).
#
# 1. Az éles (main) verzióból kiszámolja az újat, és a dev ágon beírja a js/version.js-be.
# 2. Újra kiteszi a dev környezetet (a GitHub saját tokenjével tett push magától nem indít kiadást).
# 3. Az összefoglalóban linket ad a kiadási PR-hoz (dev → main), kitöltött címmel.
#    A PR-t a tulajdonos nyitja meg és vonja össze: így futnak le rajta az ellenőrzések.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Léptetés: patch = javítás (1.0.1 → 1.0.2), minor = új funkció (→ 1.1.0), major = nem visszafelé kompatibilis (→ 2.0.0)'
        type: choice
        required: true
        default: minor
        options: [patch, minor, major]

permissions:
  contents: write   # verziócommit a dev-re
  actions: write    # a dev kiadás újraindítása

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Új verzió
        id: v
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          ver() { sed -n "s/.*VERSION = '\([0-9.]*\)'.*/\1/p"; }
          prod=$(git show origin/main:js/version.js | ver)
          dev=$(ver < js/version.js)
          IFS=. read -r a b c <<< "$prod"
          case "$BUMP" in
            major) new="$((a+1)).0.0" ;;
            minor) new="$a.$((b+1)).0" ;;
            patch) new="$a.$b.$((c+1))" ;;
          esac
          ahead=$(git rev-list --count --no-merges origin/main..HEAD)
          echo "éles: $prod  dev: $dev  új: $new  ki nem adott commitok: $ahead"
          if [ "$ahead" -eq 0 ]; then
            echo "::warning::A dev-en nincs ki nem adott változás; a kiadás az élesen semmit nem változtatna."
          fi
          echo "prod=$prod" >> "$GITHUB_OUTPUT"
          echo "dev=$dev" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Verzió beírása a dev-re
        env:
          NEW: ${{ steps.v.outputs.new }}
          DEV: ${{ steps.v.outputs.dev }}
        run: |
          if [ "$NEW" = "$DEV" ]; then
            echo "A dev már $NEW; nincs mit léptetni."
            exit 0
          fi
          sed -i "s/VERSION = '[^']*'/VERSION = '$NEW'/" js/version.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Verzió: v$NEW (kiadás előkészítése)"
          git push origin HEAD:dev

      - name: A dev kiadás újraindítása
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref dev

      - name: Link a kiadási PR-hoz
        env:
          NEW: ${{ steps.v.outputs.new }}
          PROD: ${{ steps.v.outputs.prod }}
        run: |
          title=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote('Kiadás v'+os.environ['NEW']))")
          url="https://github.com/${{ github.repository }}/compare/main...dev?expand=1&title=$title"
          {
            echo "## Kiadás előkészítve: v$PROD → v$NEW"
            echo
            echo "1. Várd meg, amíg a dev oldalon a fejléc **DEV · v$NEW** (+N) lesz, és próbáld ki."
            echo "2. **[Kiadási PR megnyitása (dev → main)]($url)** – a cím ki van töltve, pipáld ki a listát."
            echo "3. Összevonás **merge committal**."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Kiadási PR: $url"
