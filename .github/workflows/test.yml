name: Tesztek

# Csak PR-on fut (és kézzel): ugyanarra a commitra a push- és a PR-futás ugyanazt tesztelte kétszer.
# A kötelező ellenőrzéseket (test, e2e, layout) a PR-futás teljesíti; a dev/main pusht a deploy saját
# `test` jobja is ellenőrzi kiadás előtt. Ág PR nélkül: Actions → Tesztek → Run workflow.
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  # Elrendezés-teszt headless Chrome-mal (e2e/layout.mjs): a design spec elfogadási kritériumai
  # desktopon, tableten és mobilon. Hálózat nélkül fut: a listák a repó lists.txt-jéből jönnek.
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run layout

  # Funkcionális E2E headless Chrome-mal (e2e/app.mjs): listák kiválasztása, időzítő, kör, léptetés, Esc.
  # Hálózat nélkül fut: a Google táblázat kérését fix CSV válaszolja meg.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
